<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0507">
<meta name="apple-mobile-web-app-title" content="Askesia">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Askesia</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&display=swap">
<style>
/* Layout : une colonne largeur téléphone, dock en verre flottant, séance plein écran.
   Glassmorphisme futuriste : fond en dégradé vif avec sphères floues, cartes en verre dépoli,
   reflets blancs, chiffres fins et grands. Sombre = nuit violette ; clair = pastel lumineux. */
:root{
  /* Thème unique, sombre : palette Blush (framboise, rose, corail, pêche) sur noir chaud. */
  --bg:#0E0507; --ink:#FFF4EF; --muted:rgba(255,232,224,.64); --faint:rgba(255,232,224,.40);
  --glass:rgba(255,232,224,.06); --glass-2:rgba(255,232,224,.11); --glass-hi:rgba(255,232,224,.22);
  --edge:rgba(255,214,200,.20); --edge-soft:rgba(255,214,200,.10); --shade:rgba(0,0,0,.5);
  --accent:#FF7C4F; --accent-soft:rgba(255,124,79,.16); --good:#FFD08E; --good-soft:rgba(255,208,142,.16); --on-good:#2A0C14;
  --gold:#FFD08E; --gold-soft:rgba(255,208,142,.16); --danger:#FF6B7D;
  --orb-1:#9D1242; --orb-2:#C74459; --orb-3:#FF7C4F; --orb-4:#5A0B26; --orb-op:.62;
  --cta:linear-gradient(110deg,#9D1242 0%,#C74459 45%,#FF7C4F 100%); --cta-ink:#FFFFFF; --cta-glow:rgba(255,124,79,.38);
  --bar-glass:rgba(20,7,10,.55); --bar-fill:linear-gradient(90deg,#9D1242,#C74459,#FF7C4F,#FFD08E); --bar-halo:rgba(255,124,79,.45);
  --f:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:28px;
  /* alias pour le code existant */
  --fg:var(--ink); --line:var(--edge-soft); --surface:var(--glass); --surface-2:var(--glass-2); --surface-solid:var(--glass-2);
  --grad:var(--cta); --grad-deep:var(--cta); --f-display:var(--f); --f-body:var(--f); --accent-fg:#FFFFFF;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f);font-size:16px;line-height:1.45;font-weight:400;-webkit-font-smoothing:antialiased;min-height:100%;isolation:isolate}
/* Fond : dégradé maillé + sphères floues qui dérivent lentement */
body::before{content:"";position:fixed;inset:-10%;z-index:-2;pointer-events:none;opacity:var(--orb-op);
  background:
    radial-gradient(42% 32% at 12% 8%,var(--orb-1),transparent 70%),
    radial-gradient(40% 30% at 92% 34%,var(--orb-2),transparent 70%),
    radial-gradient(48% 34% at 70% 98%,var(--orb-3),transparent 70%),
    radial-gradient(36% 28% at 0% 70%,var(--orb-4),transparent 70%);
  filter:blur(30px);animation:drift 24s ease-in-out infinite alternate}
body::after{content:"";position:fixed;z-index:-1;pointer-events:none;width:300px;height:300px;right:-110px;top:-80px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.55),rgba(255,255,255,.08) 45%,transparent 70%),radial-gradient(circle at 60% 60%,var(--orb-2),transparent 70%);
  opacity:.55;border:1px solid var(--edge-soft);box-shadow:inset 0 0 60px rgba(255,255,255,.18)}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-3%,2%,0) scale(1.06)}}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:22px calc(118px + env(safe-area-inset-bottom,0px))}
.app.full{padding-bottom:calc(124px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:2.3rem;font-weight:500}
h2{font-size:1.4rem;font-weight:500}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:.74rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--f);font-weight:300;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.03em}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
/* Verre dépoli : la base de tout */
.card,.glow,.tile,.stat,.choice,.sheet,.dock-in,.tabbar-in,.input,.cell,.hint,.seg,.iconbtn,.chip,.btn.ghost,.btn.danger,.btn:not(.primary){
  -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%)}
.card{position:relative;background:linear-gradient(145deg,var(--glass-2),var(--glass));border:1px solid var(--edge);border-radius:var(--r);padding:18px;
  box-shadow:inset 0 1px 0 var(--glass-hi),0 18px 40px var(--shade)}
.card.flat{box-shadow:inset 0 1px 0 var(--glass-hi)}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:8px}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:999px;font-weight:500;font-size:1rem;
  background:var(--glass-2);border:1px solid var(--edge-soft);color:var(--ink);transition:transform .1s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--cta);color:var(--cta-ink);border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 30px var(--cta-glow)}
.btn.primary::after{content:"";position:absolute;inset:0 0 50% 0;border-radius:inherit;background:linear-gradient(rgba(255,255,255,.28),transparent);pointer-events:none}
.btn.big{min-height:62px;font-size:1.12rem;font-weight:600;width:100%;letter-spacing:.01em}
.btn.ghost{background:var(--glass)}
.btn.danger{background:var(--glass);color:var(--danger)}
.btn.small{min-height:42px;padding:0 16px;font-size:.92rem}
.btn[disabled]{opacity:.45;box-shadow:none}
.link{color:var(--accent);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--glass-2);border:1px solid var(--edge-soft);font-size:.84rem;font-weight:500;white-space:nowrap}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.good{background:var(--good-soft);color:var(--good)}
.icon{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* Dock d'onglets flottant */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 16px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabbar-in{pointer-events:auto;max-width:420px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);padding:8px;border-radius:999px;
  background:var(--bar-glass);border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--glass-hi),0 16px 40px var(--shade)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:999px;font-size:.72rem;font-weight:500;color:var(--muted)}
.tab[aria-current="page"]{color:var(--ink);background:var(--glass-2);box-shadow:inset 0 1px 0 var(--glass-hi)}
.tab .icon{width:24px;height:24px}
/* Progression */
.bar{height:10px;border-radius:99px;background:var(--glass);border:1px solid var(--edge-soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--bar-fill);box-shadow:0 0 14px var(--bar-halo)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.74rem;font-weight:500;color:var(--muted)}
.day i{width:100%;max-width:40px;aspect-ratio:1;border-radius:14px;background:var(--glass);border:1px solid var(--edge-soft);display:grid;place-items:center;color:#fff}
.day.on i{background:var(--cta);border-color:rgba(255,255,255,.4);box-shadow:0 6px 16px var(--cta-glow)}
.day.today span{color:var(--ink);font-weight:700}
.day.today i{outline:1.5px solid var(--ink);outline-offset:2px}
/* En-tête */
.who{display:flex;align-items:center;gap:12px;min-width:0}
.avatar{width:52px;height:52px;border-radius:50%;padding:2px;background:var(--cta);flex:none;box-shadow:0 6px 18px var(--cta-glow)}
.avatar span{width:100%;height:100%;border-radius:50%;background:var(--glass-2);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:grid;place-items:center;font-weight:500;font-size:1.3rem;color:var(--ink)}
/* Carte héros : verre avec halo intérieur (style Roja) */
.glow{position:relative;overflow:hidden;border-radius:32px;border:1px solid var(--edge);padding:22px;
  background:linear-gradient(160deg,var(--glass-2),var(--glass));box-shadow:inset 0 1px 0 var(--glass-hi),0 24px 50px var(--shade)}
.glow::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(70% 55% at 85% 0%,color-mix(in srgb,var(--orb-2) 55%,transparent),transparent 70%),
             radial-gradient(80% 50% at 10% 110%,color-mix(in srgb,var(--orb-3) 45%,transparent),transparent 70%)}
.glow>*{position:relative}
.glow .hot{color:var(--ink);opacity:.8}
.glow ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.glow li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--edge-soft);font-weight:400}
.glow li:last-child{border-bottom:0}
.glow li b{font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.glow li{align-items:center}
.glow li>span{flex:1}
.grip{flex:none;width:30px;height:34px;margin:-8px -6px -8px -8px;display:grid;place-items:center;touch-action:none;cursor:grab;opacity:.35;background:none;border:0;color:inherit;border-radius:10px}
.grip::before{content:"";width:14px;height:5px;border-block:1.5px solid currentColor}
.grip:focus-visible{opacity:1}
.glow li.lift{z-index:2;background:var(--glass-hi);border-radius:14px;box-shadow:0 10px 24px var(--shade);border-color:transparent}
.glow>.cardbtns{position:absolute;top:10px;right:10px;display:flex;gap:2px}
.homebtn[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills .chip{min-height:40px}
.glow.fo,.done-card.fo{animation:flipOut .22s ease-in forwards}
.glow.fi{animation:flipIn .45s cubic-bezier(.2,.8,.3,1.15)}
.glow.fi::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:45%;pointer-events:none;background:linear-gradient(100deg,transparent,color-mix(in srgb,var(--gold) 35%,transparent),transparent);animation:bShine 1.2s .25s ease-out forwards}
@keyframes flipOut{to{transform:perspective(900px) rotateY(90deg);opacity:.6}}
@keyframes flipIn{from{transform:perspective(900px) rotateY(-90deg);opacity:.6}}
/* Barre de stats en verre (style « Focus · Plan · Execute ») */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);border-radius:var(--r);border:1px solid var(--edge);
  background:linear-gradient(145deg,var(--glass-2),var(--glass));box-shadow:inset 0 1px 0 var(--glass-hi),0 18px 40px var(--shade);
  -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%)}
.tile{padding:16px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0;background:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.tile+.tile{border-left:1px solid var(--edge-soft)}
.tile .icon{width:34px;height:34px;padding:7px;border-radius:50%;background:var(--glass-2);color:var(--ink)}
.tile .num{font-size:2rem}
.tile small{font-size:.74rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:linear-gradient(145deg,var(--glass-2),var(--glass));border:1px solid var(--edge);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;box-shadow:inset 0 1px 0 var(--glass-hi)}
.stat .num{font-size:2rem}
.stat small{font-size:.78rem;color:var(--muted);font-weight:500}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--edge-soft);text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .t{font-weight:500}
.item .s{font-size:.86rem;color:var(--muted)}
.badge-dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--glass-2);border:1px solid var(--edge-soft);color:var(--ink);flex:none}
.badge-dot.accent{background:var(--accent-soft);color:var(--accent)}
.badge-dot.gold{background:var(--gold-soft);color:var(--gold)}
/* Questionnaire */
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;gap:14px;padding:17px 18px;border-radius:24px;background:linear-gradient(145deg,var(--glass-2),var(--glass));border:1px solid var(--edge-soft);text-align:left;width:100%;box-shadow:inset 0 1px 0 var(--glass-hi)}
.choice .t{font-weight:500;font-size:1.06rem}
.choice .s{font-size:.88rem;color:var(--muted)}
.choice .tick{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--edge);display:grid;place-items:center;flex:none;color:#fff}
.choice[aria-pressed="true"]{border-color:var(--ink);background:linear-gradient(145deg,var(--glass-hi),var(--glass-2))}
.choice[aria-pressed="true"] .tick{background:var(--cta);border-color:transparent;box-shadow:0 4px 12px var(--cta-glow)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--glass);border:1px solid var(--edge-soft);padding:5px;border-radius:999px}
.seg button{min-height:50px;border-radius:999px;font-weight:300;font-size:1.4rem;border:1px solid transparent}
.seg.sm{padding:3px}
.seg.sm button{min-height:38px;font-size:.95rem}
.feel{display:flex;flex-direction:column;gap:6px;width:100%;max-width:340px}
.feel>.muted{font-size:.85rem}
.feel>.muted:empty{display:none}
.seg button[aria-pressed="true"]{background:var(--glass-hi);color:var(--accent);font-weight:500;border-color:var(--edge);box-shadow:0 6px 16px var(--shade)}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--glass-2)}
.steps i.on{background:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:500;font-size:.92rem}
.input{min-height:56px;border-radius:20px;border:1px solid var(--edge);background:var(--glass);padding:0 18px;font-size:1.08rem;width:100%;box-shadow:inset 0 1px 0 var(--glass-hi)}
.input::placeholder{color:var(--faint)}
.input:focus{outline:none;border-color:var(--ink)}
.hero-title{font-size:4.4rem;line-height:1;font-weight:200;letter-spacing:-.05em}
/* Séance */
.wk-top{display:flex;align-items:center;gap:12px}
.iconbtn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--glass-2);border:1px solid var(--edge-soft);flex:none;box-shadow:inset 0 1px 0 var(--glass-hi)}
.segs{display:flex;gap:4px;flex:1}
.segs i{flex:1;height:6px;border-radius:6px;background:var(--glass-2);overflow:hidden;position:relative}
.segs i b{position:absolute;inset:0;background:var(--ink);transform-origin:left}
.segs i.cur{box-shadow:0 0 0 1px var(--ink)}
.ex-name{font-size:2.2rem;font-weight:500}
.sets{width:100%;border-collapse:separate;border-spacing:0 8px;table-layout:fixed}
.sets th{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:center;padding:0 4px}
.sets td{padding:0 4px}
.sets td:first-child{font-weight:300;font-size:1.5rem;width:40px;text-align:center;color:var(--faint)}
.sets tr.cur td:first-child{color:var(--ink);font-weight:500}
.sets tr.done td:first-child{color:var(--good)}
.cell{width:100%;min-height:58px;border-radius:20px;border:1px solid var(--edge-soft);background:var(--glass);text-align:center;font-weight:400;font-size:1.5rem;font-variant-numeric:tabular-nums;padding:0 4px;min-width:0;box-shadow:inset 0 1px 0 var(--glass-hi)}
.cell:focus{outline:none;border-color:var(--ink)}
tr.cur .cell{border-color:var(--ink);background:var(--glass-2)}
tr.done .cell{background:var(--good-soft);border-color:transparent;color:var(--good)}
.check{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--glass-2);border:1px solid var(--edge-soft);color:var(--muted)}
.check .icon{width:24px;height:24px}
tr.done .check{background:var(--good);color:var(--on-good);border-color:transparent;box-shadow:0 6px 18px var(--good-soft)}
.hint{display:flex;gap:10px;align-items:flex-start;padding:13px 16px;border-radius:20px;background:var(--glass);border:1px solid var(--edge-soft);font-size:.92rem}
.hint.gold{background:var(--gold-soft);color:var(--gold)}
.hint.accent{background:var(--accent-soft);color:var(--ink)}
details summary{list-style:none;display:flex;align-items:center;justify-content:space-between}
details summary::-webkit-details-marker{display:none}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 16px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dock-in{pointer-events:auto;max-width:528px;margin:0 auto;display:flex;gap:10px;align-items:center;padding:8px;border-radius:999px;background:var(--bar-glass);border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--glass-hi),0 16px 40px var(--shade)}
.dock .btn.big{flex:1}
/* Repos / chrono : orbe en verre */
.rest{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:color-mix(in srgb,var(--bg) 55%,transparent);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%)}
.rest-in{position:relative;width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
.ring{position:relative;width:270px;height:270px;max-width:74vw;max-height:74vw;border-radius:50%;
  background:radial-gradient(circle at 35% 28%,var(--glass-hi),var(--glass) 55%,transparent 75%);border:1px solid var(--edge);box-shadow:inset 0 0 50px rgba(255,255,255,.12),0 30px 60px var(--shade)}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-size:4.8rem;font-weight:200}
/* Fenêtre du bas */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(6,3,20,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:color-mix(in srgb,var(--bg) 70%,transparent);border:1px solid var(--edge);border-bottom:0;border-radius:32px 32px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:inset 0 1px 0 var(--glass-hi)}
.grab{width:42px;height:5px;border-radius:5px;background:var(--edge);background-clip:content-box;padding:12px 60px;margin:-12px auto 2px;box-sizing:content-box;touch-action:none}
.iconbtn.sm{width:44px;height:44px;background:none;border:0;box-shadow:none;color:var(--muted)}
.iconbtn.sm .icon{width:18px;height:18px}
.bar.xp>i{animation:bGrow 1.2s cubic-bezier(.2,.8,.25,1) .2s both}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);border:1px solid var(--edge);padding:12px 20px;border-radius:999px;font-weight:500;box-shadow:0 12px 30px var(--shade);max-width:calc(100% - 32px);text-align:center;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.vol{display:grid;grid-template-columns:92px 1fr 40px;align-items:center;gap:10px;font-size:.88rem}
.vol b{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.bar>i.low{background:var(--glass-hi);box-shadow:none}
.bar>i.ok{background:var(--cta)}
.bar>i.high{background:#FF7C4F;box-shadow:0 0 12px rgba(255,124,79,.5)}
tr.warm td:first-child{font-size:.85rem;color:var(--faint)}
.cell.static{display:grid;place-items:center;opacity:.75;font-size:1.2rem}

EX.forEach(e=>{ e.avoid=Object.keys(AVOID).filter(z=>AVOID[z].includes(e.id)); });
const EXM = Object.fromEntries(EX.map(e=>[e.id,e]));

/* =====================================================================
   MOTEUR — une fonction pure par règle. Elles reçoivent le profil (p),
   les séances de muscu (ws) et l'heure (now) ; elles ne touchent ni à
   l'écran ni au stockage.
   ===================================================================== */
const DAY = 864e5;
const addDays = (d,n)=>{ d=new Date(d); d.setDate(d.getDate()+n); return d; };   // jours du calendrier : juste aussi au changement d'heure
const round2 = v=>Math.round(v*100)/100;
const work = sets=>(sets||[]).filter(s=>!s.warm);
const isMain = ex=>ex.k==='P';
const isWeighted = ex=>ex.start!=null;
// Débutant ou 50 ans et plus : variantes plus faciles et charges de départ à 75 %.
const startsEasy = p=>p.level==='debutant' || p.age>=AGE_EASY;
function mondayOf(d){ d=new Date(d); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d; }

// Matériel : « Salle » donne accès à tout le reste ; le poids du corps est toujours là.
function eqSet(p){ const s=new Set(['corps',...(p.equipment||[])]); if(s.has('salle')) ['halteres','elastique','traction','kettlebell','marche'].forEach(x=>s.add(x)); return s; }
// Disponible = matériel présent et aucune zone à ménager sollicitée.
// Version maison : poids du corps + matériel coché, sans la salle ; ses variantes sont mémorisées à part.
const hasGym=p=>(p.equipment||[]).includes('salle');
const homeOf=p=>({...p, equipment:(p.equipment||[]).filter(e=>e!=='salle'), swaps:p.swapsHome||{}});
function available(ex,p){ const s=eqSet(p); return ex.eq.some(e=>s.has(e)) && !(ex.avoid||[]).some(z=>(p.avoid||[]).includes(z)); }

// Programme selon jours ET niveau. null = 6 jours en débutant ou reprise (proposer 4 ou 5).
function programFor(p){ const row=PROGRAMS[p.days]; return row ? row[LEVELS[p.level].col] : null; }
function rotation(p){ return programFor(p) || PROGRAMS[5][0]; }
function needsFewerDays(days,level){ return !!PROGRAMS[days] && PROGRAMS[days][LEVELS[level].col]===null; }

// La prochaine séance suit toujours la dernière faite (séance manquée : rien n'est perdu).
function nextIndex(p,ws){
  const rot=rotation(p), last=[...ws].reverse().find(s=>!s.extra);   // une séance faite avec un ami ne compte pas dans l'ordre du programme
  if(!last) return 0;
  let i=(typeof last.rot==='number' && rot[last.rot]===last.tpl) ? last.rot : rot.indexOf(last.tpl);
  return i<0 ? 0 : (i+1)%rot.length;
}

// Objectif → répétitions et repos ; un débutant reste à 8–12 sur les principaux pendant 4 semaines.
function repRange(ex,p,now){
  if(ex.t) return null;
  if(ex.reps) return [ex.reps,ex.reps];   // exercices doux : nombre fixe, comme dans le programme sénior
  const g=GOALS[p.goal];
  if(isMain(ex) && p.level==='debutant' && now-new Date(p.createdAt||now)<28*DAY) return [8,12];
  return isMain(ex) ? g.main : g.iso;
}
function restFor(ex,p){ const g=GOALS[p.goal]; return isMain(ex) ? g.restMain : g.restIso; }
// Niveau → séries (régulier en 60 min : 4 séries sur les 2 premiers exercices). Décharge : 2 séries.
function setsFor(p,pos,deload){
  if(deload) return 2;
  const L=LEVELS[p.level]; if(L.four && p.duration>=L.four && pos<2) return 4;
  return LEVELS[p.level].sets;
}

// Emplacement → premier exercice compatible (ou la variante choisie par l'utilisatrice).
function slotExercise(key,i,p,used,fam){
  const base=TPL[key].slots[i]; fam=fam||base;
  const chosen=fam===base && p.swaps && p.swaps[key+':'+i];
  if(chosen && EXM[chosen] && available(EXM[chosen],p) && !used.has(chosen)) return EXM[chosen];
  // 50 ans et + : seulement le programme doux ; une famille sans exercice doux est sautée.
  if(p.age>=AGE_EASY) return EX.find(e=>e.f===fam && e.senior && available(e,p) && !used.has(e.id)) || null;
  const ex=EX.find(e=>e.f===fam && !e.senior && available(e,p) && !used.has(e.id)) || null;
  // Débutant au poids du corps : on commence par la variante plus facile quand elle existe.
  if(ex && startsEasy(p) && ex.eq.includes('corps') && !ex.t){ const e2=ex.easy && EXM[ex.easy]; if(e2 && available(e2,p) && !used.has(e2.id)) return e2; }
  return ex;
}
// Séance type → liste d'exercices. La durée fixe le nombre ; un emplacement sans exercice est sauté.
const ACC=['lateral','rear','biceps','triceps','calves','core','abs'];   // familles d'appoint (isolation)
const famMus=f=>(EX.find(e=>e.f===f)||{mus:[]}).mus[0];
// Exercices d'appoint : les muscles les moins travaillés de la semaine (jamais au-delà de 20 séries), un muscle par exercice.
function accFamilies(slots,vol,p){
  const own=slots.filter(f=>ACC.includes(f)), v=f=>vol[famMus(f)]||0, r=f=>own.includes(f)?own.indexOf(f):9+ACC.indexOf(f), mus=new Set(), out=[];
  ACC.filter(f=>v(f)<VOLUME.high && EX.some(e=>e.f===f && available(e,p) && !!e.senior===(p.age>=AGE_EASY))).sort((a,b)=>v(a)-v(b) || r(a)-r(b))
    .forEach(f=>{ if(out.length<own.length && !mus.has(famMus(f))){ mus.add(famMus(f)); out.push(f); } });
  return out;
}
function plan(key,p,opts){
  opts=opts||{};
  const want=DUR_EX[p.duration]||5, out=[], used=new Set(), now=opts.now||Date.now();
  const acc=opts.vol && accFamilies(TPL[key].slots,opts.vol,p);
  TPL[key].slots.forEach((fam,i)=>{
    if(out.length>=want) return;
    if(acc && ACC.includes(fam)){ fam=acc.shift(); if(!fam) return; }
    const ex=slotExercise(key,i,p,used,fam); if(!ex) return;
    used.add(ex.id);
    out.push({slot:i, fam, exId:ex.id, sets:setsFor(p,out.length,opts.deload), range:repRange(ex,p,now), rest:restFor(ex,p)});
  });
  return out;
}

// Incréments de charge selon le matériel.
function incOf(ex,p){
  if(!isWeighted(ex)) return 0;
  if(ex.gear==='barre') return LOWER_FAMILIES.includes(ex.f) ? 5 : 2.5;
  if(ex.gear==='machine') return 5;
  if(ex.eq[0]==='kettlebell' || (ex.eq.includes('kettlebell') && !eqSet(p).has('halteres'))) return 4;
  if(isMain(ex)) return ex.ph ? 1 : 2;   // +2 kg au total = +1 kg par haltère
  return 1;
}
// Première charge : maximum estimé (sexe, âge, poids) × % du niveau, −10 % ; sans poids, la charge par défaut.
function startLoad(ex,p,inc){
  const L=LIFT[ex.id], w=+p.weight;
  if(!L || !(w>0)) return startsEasy(p) ? roundTo(ex.start*0.75,inc) : ex.start;
  const a=+p.age||30, lv=LEVELS[p.level]||LEVELS.reprise, row=STRENGTH[p.sex==='homme'?'homme':'femme'][a<40?20:a<50?40:a<60?50:a<70?60:70][L[0]];
  return roundTo(w*row[lv.top?1:0]*lv.pct*L[1]*0.9, inc);
}
function roundTo(v,inc){ return Math.max(inc, round2(Math.round(v/inc)*inc)); }

// Historique d'un exercice, hors semaines de décharge et séries d'approche.
function entries(ws,exId){
  const out=[];
  ws.forEach(s=>{ if(s.deload) return; const e=(s.exercises||[]).find(x=>x.exId===exId); if(e){ const w=work(e.sets); if(w.length) out.push({s, sets:w, feel:e.feel||(s.exercises.some(x=>x.feel)?null:s.feeling)}); } });
  return out;
}
function scoreOf(ex,sets){
  if(!sets.length) return null;
  if(ex.t) return Math.max(...sets.map(s=>+s.secs||0));
  if(isWeighted(ex)) return Math.max(...sets.map(s=>(+s.kg||0)+(+s.reps||0)/1000));
  return Math.max(...sets.map(s=>+s.reps||0));
}

// Retour après 14 jours ou plus sans séance.
function isReturning(ws,now){ const last=ws[ws.length-1]; return !!last && now-new Date(last.date)>=14*DAY; }

// Règle principale de progression (double progression).
function suggest(item,p,ws,ctx){
  ctx=ctx||{};
  const ex=EXM[item.exId], hist=entries(ws,item.exId), last=hist[hist.length-1];
  let r;
  if(ex.t){
    const base=LEVELS[p.level].core;
    if(!last) r={secs:base, note:'Première fois : tiens '+base+' secondes, sans forcer.'};
    else {
      const mx=Math.max(...last.sets.map(s=>+s.secs||0)), secs=last.feel==='dur'?mx:last.feel==='facile'?mx+10:mx+5;
      r={secs, up:secs>mx, note:secs>mx?'+'+(secs-mx)+' s par rapport à la dernière fois.':'Même durée que la dernière fois.'};
      if(secs>60 && ex.hard){ r.harder=true; r.note+=' Tu dépasses 60 s : essaie la variante plus dure.'; }
    }
  } else if(isWeighted(ex)){
    const inc=incOf(ex,p), lo=item.range[0], hi=item.range[1], per=ex.ph?' par haltère':'';
    if(!last){
      const kg=startLoad(ex,p,inc);
      r={kg, reps:lo, note:'Première fois : '+fmt(kg)+' kg'+per+' est une suggestion. Prends une charge qui te laisse 2 répétitions en réserve.'};
    } else {
      const kg=Math.max(...last.sets.map(s=>+s.kg||0)), atKg=last.sets.filter(s=>+s.kg===kg);
      const allTop=atKg.length>=Math.min(item.sets,last.sets.length) && atKg.every(s=>+s.reps>=hi);
      const under=e=>!!e && Math.max(...e.sets.map(s=>+s.kg||0))===kg && Math.min(...e.sets.filter(s=>+s.kg===kg).map(s=>+s.reps||0))<lo;
      if(allTop && last.feel!=='dur'){
        const nk=round2(kg+inc);
        r={kg:nk, reps:lo, up:true, note:'Tu as tout validé à '+fmt(kg)+' kg : on monte à '+fmt(nk)+' kg'+per+'.'};
      } else if(under(last) && under(hist[hist.length-2])){
        const nk=Math.max(inc,round2(kg-inc));
        r={kg:nk, reps:lo, note:'Deux fois sous '+lo+' répétitions à '+fmt(kg)+' kg : on allège à '+fmt(nk)+' kg pour repartir.'};
      } else {
        const reps=Math.min(hi,Math.max(lo,Math.min(...atKg.map(s=>+s.reps||0))+(last.feel==='facile'?2:1)));
        r={kg, reps, note: allTop ? 'Noté dur la dernière fois : on garde '+fmt(kg)+' kg, vise '+reps+' répétitions.' : 'Même charge, vise '+reps+' répétitions sur chaque série.'};
      }
    }
  } else {
    const lo=item.range[0], hi=item.range[1], base=Math.min(Math.max(LEVELS[p.level].bw,lo),hi+3);
    if(!last) r={reps:base, note:'Première fois : vise '+base+' répétitions propres.'};
    else {
      const mn=Math.min(...last.sets.map(s=>+s.reps||0)), reps=last.feel==='dur'?mn:last.feel==='facile'?mn+2:mn+1;
      r={reps, up:reps>mn, note:reps>mn+1?'Deux répétitions de plus que la dernière fois.':reps>mn?'Une répétition de plus que la dernière fois.':'Même objectif que la dernière fois.'};
      if(reps>20 && ex.hard){ r.harder=true; r.note+=' Plus de 20 répétitions : passe à la variante plus dure.'; }
    }
  }
  if(r.kg!=null && (ctx.deload || ctx.returning)){
    const inc=incOf(ex,p); r.kg=Math.max(inc,round2(Math.floor(r.kg*0.9/inc+1e-9)*inc)); r.up=false;   // arrondi vers le bas : la charge baisse vraiment
    r.note=(ctx.returning?'Bon retour, on reprend en douceur : ':'Semaine allégée : ')+fmt(r.kg)+' kg'+(ex.ph?' par haltère':'')+' (−10 %).';
  }
  return r;
}

// Décharge : proposée (jamais imposée) sur 2 « dur » d'affilée, 3 exercices qui stagnent, ou 8 semaines sans décharge.
function deloadState(p,ws){
  const d=p.deload; if(!d) return {active:false};
  const n=ws.filter(s=>s.deload && s.date>=d.start).length;
  return n<d.n ? {active:true, left:d.n-n} : {active:false};
}
function stagnating(ws){
  const ids=[...new Set(ws.flatMap(s=>(s.exercises||[]).map(e=>e.exId)))].filter(id=>EXM[id]);
  return ids.filter(id=>{
    const h=entries(ws,id); if(h.length<4) return false;
    const ex=EXM[id], ref=scoreOf(ex,h[h.length-4].sets);
    return h.slice(-3).every(e=>scoreOf(ex,e.sets)<=ref+1e-9);
  });
}
function deloadReason(p,ws,now){
  if(deloadState(p,ws).active) return null;
  const since=p.deload ? p.deload.start : null;
  const pool=ws.filter(s=>!s.deload && (!since || s.date>=since));
  if(!pool.length) return null;
  if(p.deloadDeclinedAt && !pool.some(s=>s.date>p.deloadDeclinedAt)) return null;
  const last2=pool.slice(-2);
  if(last2.length===2 && last2.every(s=>s.feeling==='dur')) return 'dur';
  if(stagnating(pool).length>=3) return 'stagne';
  const first=since || pool[0].date;
  if(now-new Date(first)>=56*DAY) return 'semaines';
  return null;
}

// Volume par muscle de la semaine : 1 pour le muscle principal, 0,5 pour chaque secondaire.
function weekVolume(ws,now,from,to){
  const m=from!=null?from:+mondayOf(now), e=to!=null?to:+addDays(m,7), v={};
  ws.forEach(s=>{ const t=+new Date(s.date); if(t<m||t>=e) return;
    (s.exercises||[]).forEach(x=>{ const ex=EXM[x.exId]; if(!ex) return; const n=work(x.sets).length;
      ex.mus.forEach((mu,i)=>{ v[mu]=(v[mu]||0)+n*(i?0.5:1); }); }); });
  return v;
}
// Séance proposée : celle dont les muscles ont le plus récupéré (séries des 72 dernières heures) ; à égalité, l'ordre du programme.
function restedIndex(p,ws,now){
  const rot=rotation(p), ni=nextIndex(p,ws), fat=weekVolume(ws,now,now-3*DAY,now+1);
  let best=ni, bs=Infinity;
  rot.forEach((_,j)=>{ const i=(ni+j)%rot.length, sc=plan(rot[i],p).reduce((a,it)=>a+(fat[EXM[it.exId].mus[0]]||0),0); if(sc<bs-1e-9){ bs=sc; best=i; } });
  return best;
}
function volumeZone(n){ return n<VOLUME.low ? 'low' : n>VOLUME.high ? 'high' : 'ok'; }

// Variantes « trop dur » / « trop facile » disponibles avec le matériel.
function variantOf(exId,dir,p){ const id=EXM[exId] && EXM[exId][dir==='easy'?'easy':'hard']; return id && EXM[id] && available(EXM[id],p) ? id : null; }

// Séries d'approche pour le premier exercice avec charge (hors statistiques).
function approachSets(kg,ex,p){ const inc=incOf(ex,p); return WARMUP.approach.map(a=>({kg:roundTo(kg*a.pct,inc), reps:a.reps, done:false})); }

const Store = {
  authState:'pending',   // pending | in | out | unavailable
  fb:null, auth:null, db:null, user:null, uid:null, unsub:[], draftT:null,
  init(){

  ref(...p){ return this.fb.fs.doc(this.db,'users',this.uid,...p); },

  // Une écriture ne bloque jamais l'appli : Firestore la garde et l'envoie dès que possible.
  write(fn){ if(!this.uid) return; try{ Promise.resolve(fn()).catch(e=>console.warn('Écriture en ligne refusée', e)); }catch(e){ console.warn(e); } },
  // Première synchro : réunit l'appareil et le compte, sans doublon (une séance = un identifiant).
  async sync(){
    const fs=this.fb.fs, uid=this.uid, owner=lsGet(OWNER_KEY);
    const [ps,qs,ds]=await Promise.all([fs.getDoc(this.ref()), fs.getDocs(this.sesCol()), fs.getDoc(this.ref('state','draft'))]);
    const cloudProf=ps.exists()?clone(ps.data()):null, cloudSes=qs.docs.map(d=>clone(d.data()));
    const cloudDraft=ds.exists()&&ds.data().draft?clone(ds.data().draft):null;
    const cloudEmpty=!cloudProf && !cloudSes.length;
    const newer=(a,b)=>(a&&a.updatedAt||'')>(b&&b.updatedAt||'');
    let got=0;
    const merge=list=>{ const ids=new Set(S.sessions.map(x=>x.id)); let n=0;
      (list||[]).forEach(x=>{ if(x && x.id && !ids.has(x.id)){ ids.add(x.id); S.sessions.push(x); n++; this.write(()=>fs.setDoc(fs.doc(this.sesCol(),x.id),clone(x))); } });
      return n; };
    if(owner===uid){
      // Mêmes données, peut-être modifiées hors ligne : le plus récent gagne.
      if(cloudProf && !newer(S.profile,cloudProf)) S.profile=cloudProf; else if(S.profile) this.write(()=>fs.setDoc(this.ref(),clone(S.profile)));
      const byId=new Map(cloudSes.map(x=>[x.id,x]));
      // Absente du compte : nouvelle (faite depuis la dernière synchro) → on l'envoie ; plus ancienne → supprimée ailleurs, on ne la garde pas.
      // shortcut: compare l'heure de deux appareils ; une horloge très décalée peut encore faire revenir une séance supprimée.
      const last=lsGet(SYNC_KEY)||'';
      S.sessions.forEach(x=>{ const c=byId.get(x.id); if(c?newer(x,c):(x.updatedAt||'')>last){ byId.set(x.id,x); this.write(()=>fs.setDoc(fs.doc(this.sesCol(),x.id),clone(x))); } });
      S.sessions=[...byId.values()];
    } else if(cloudEmpty && (owner==null || owner==='guest') && (S.profile || S.sessions.length)){
      // Première connexion, compte vide : on transfère ce qui est sur l'appareil.
      const batch=fs.writeBatch(this.db);
      if(S.profile) batch.set(this.ref(),clone(S.profile));
      S.sessions.forEach(x=>batch.set(fs.doc(this.sesCol(),x.id),clone(x)));
      this.write(()=>batch.commit());
      if(draft) this.write(()=>fs.setDoc(this.ref('state','draft'),{draft:clone(draft)}));
      toast('Tes données sont maintenant sauvegardées sur ton compte.');
    } else {
      // Le compte a déjà des données : on prend celles du compte, et on y ajoute les séances faites sans compte sur cet appareil
      // (celles d'un autre compte restent à l'autre compte).
      const mine=owner==='guest'||owner==null ? S.sessions : [];
      S.profile=cloudProf; S.sessions=cloudSes; got+=merge(mine);
      draft=cloudDraft; lsSet('reprise.draft',draft);
    }
    // Séances mises de côté par l'ancienne version : on les rend au compte.
    const bk=lsGet('askesia.guestBackup'); if(bk){ got+=merge(bk.sessions); lsSet('askesia.guestBackup',null); }
    if(got) toast(got+' séance'+(got>1?'s':'')+' récupérée'+(got>1?'s':'')+' et ajoutée'+(got>1?'s':'')+' à ton compte.');
    if(!draft && cloudDraft){ draft=cloudDraft; lsSet('reprise.draft',draft); }
    S.sessions.sort((a,b)=>a.date<b.date?-1:1);
    this.cache(); lsSet(SYNC_KEY,new Date().toISOString());
  },
  // Les changements faits sur un autre appareil arrivent en direct.
  listen(){
    const fs=this.fb.fs;
    this.unsub.push(fs.onSnapshot(this.ref(),snap=>{
      if(snap.metadata.hasPendingWrites || !snap.exists()) return;
      const d=clone(snap.data()); if(JSON.stringify(d)===JSON.stringify(S.profile)) return;
      S.profile=d; this.cache(); if(ui.screen!=='workout') render();
    },e=>console.warn(e)));
    this.unsub.push(fs.onSnapshot(this.sesCol(),qs=>{
      if(qs.metadata.hasPendingWrites) return;
      const list=qs.docs.map(d=>clone(d.data())).sort((a,b)=>a.date<b.date?-1:1);
      if(JSON.stringify(list)===JSON.stringify(S.sessions)) return;
      S.sessions=list; this.cache(); if(ui.screen!=='workout') render();
    },e=>console.warn(e)));
  },
  cache(){ lsSet('reprise.profile',S.profile); lsSet('reprise.sessions',S.sessions); if(this.uid) lsSet(OWNER_KEY,this.uid); },
  saveProfile(p){ S.profile=stamp(p); this.cache(); this.write(()=>this.fb.fs.setDoc(this.ref(),clone(S.profile))); },
  saveSession(x){ stamp(x); S.sessions=S.sessions.filter(y=>y.id!==x.id).concat([x]).sort((a,b)=>a.date<b.date?-1:1); this.cache();
    this.write(()=>this.fb.fs.setDoc(this.fb.fs.doc(this.sesCol(),x.id),clone(x))); },
  deleteSession(id){ S.sessions=S.sessions.filter(x=>x.id!==id); this.cache(); this.write(()=>this.fb.fs.deleteDoc(this.fb.fs.doc(this.sesCol(),id))); },
  // La séance en cours part en ligne au plus une fois toutes les 2 secondes.
  saveDraft(){ lsSet('reprise.draft',draft); if(!this.uid) return; clearTimeout(this.draftT);
    this.draftT=setTimeout(()=>{ const body=draft?{draft:clone(draft)}:null; this.write(()=>body?this.fb.fs.setDoc(this.ref('state','draft'),body):this.fb.fs.deleteDoc(this.ref('state','draft'))); },2000); },
  resetAll(){
    const ids=S.sessions.map(x=>x.id);
    S.profile=null; S.sessions=[]; draft=null; lsSet('reprise.draft',null); this.cache();
    if(this.uid){ const fs=this.fb.fs, b=fs.writeBatch(this.db); ids.forEach(id=>b.delete(fs.doc(this.sesCol(),id))); b.delete(this.ref('state','draft')); b.delete(this.ref()); this.write(()=>b.commit()); }
  },
  // Connexion Google : fenêtre, ou redirection si la fenêtre est bloquée (iPhone).
  async signIn(){

    if(!this.auth){ toast(navigator.onLine===false?'Pas de connexion internet.':'Connexion indisponible pour le moment.'); return; }

function authMessage(e){
  const c=e&&e.code||'';
  if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request'||c==='auth/user-cancelled') return '';
  if(c==='auth/network-request-failed') return 'Pas de connexion internet. Réessaie dans un instant.';
  if(c==='auth/unauthorized-domain') return 'Ce site n’est pas autorisé dans Firebase (domaines autorisés).';
  if(c==='auth/invalid-api-key'||c==='auth/api-key-not-valid.-please-pass-a-valid-api-key.') return 'La clé API Firebase est incorrecte dans index.html.';
  return 'Connexion impossible pour le moment.';
}

let oracleT=[];
function runOracle(){
  oracleT.forEach(clearTimeout); oracleT=[];
  const step=i=>{
    document.querySelectorAll('.o-row').forEach((r,j)=>{ r.className='o-row'+(j<i?' done':j===i?' now':''); r.querySelector('i').innerHTML=j<i?CHECK:''; });
    const f=$('#o-fil'); if(f) f.style.strokeDashoffset=100-ORACLE_AT[Math.min(i,4)];
    const c=$('#o-count'); if(c) c.textContent=i<5?'Étape '+(i+1)+' sur 5':'C’est prêt';
  };
  for(let i=0;i<=5;i++) oracleT.push(setTimeout(()=>step(i),200+i*850));
  oracleT.push(setTimeout(()=>{ if(ui.ob.step===10){ ui.ob.step=11; render(); } },200+5*850+700));
}

function draftExercise(it,ctx){
  const ex=EXM[it.exId], sg=suggest(it,S.profile,workouts(),ctx);
  return {slot:it.slot, ...(it.fam?{fam:it.fam}:{}), exId:it.exId, range:it.range, rest:it.rest, note:sg.note, up:!!sg.up, harder:!!sg.harder,
    sets:Array.from({length:it.sets},()=>({kg:isWeighted(ex)?sg.kg:'', reps:ex.t?'':sg.reps, secs:ex.t?sg.secs:'', done:false}))};
}
const PICK_KEY='askesia.pick';   // séance choisie sur l'accueil (autre séance, lieu, ordre), gardée jusqu'à ce qu'on la commence
// Range les exercices selon l'ordre choisi (liste d'emplacements) ; ceux qui n'y sont pas restent à la fin.
const inOrder=(items,order)=>{ if(!order) return items; const o=order.map(String), at=x=>(o.indexOf(String(x.slot))+1)||99; return [...items].sort((a,b)=>at(a)-at(b)); };
const grip=n=>`<button type="button" class="grip" aria-label="Déplacer ${esc(n)} (flèches haut et bas)"></button>`;
function flipTo(pick){
  const go=()=>{ lsSet(PICK_KEY,pick); ui.flip=true; render(); ui.flip=false; };
  const c=$('main .glow,main .done-card');
  if(!c || matchMedia('(prefers-reduced-motion: reduce)').matches) return go();
  c.classList.add('fo'); setTimeout(go,220);
}
const FEELS=[['facile','Facile'],['ok','Bien'],['dur','Dur']];
const feelRow=(i,f,label)=>`<div class="feel"><span class="muted">${label}</span><div class="seg sm" role="group" aria-label="Ressenti">${FEELS.map(([k,l])=>`<button data-a="exfeel" data-i="${i}" data-v="${k}" aria-pressed="${f===k}">${l}</button>`).join('')}</div></div>`;
// Ressenti de la séance : « dur » si au moins la moitié des exercices notés l'étaient (sert à proposer la semaine allégée).
function sessionFeel(exs){
  const f=exs.map(e=>e.feel).filter(Boolean), n=k=>f.filter(x=>x===k).length;
  return !f.length ? 'ok' : n('dur')*2>=f.length ? 'dur' : n('facile')*2>f.length ? 'facile' : 'ok';
}
const SITE = 'https://aurelieagp.github.io/askesia/';
const SHARED_KEY = 'askesia.shared';   // séance reçue d'un ami, en attente
// Lien « faire avec un ami » : #avec={de, s (séance), x (exercices dans l'ordre)}. Le contenu vient d'un lien : on ne garde que des exercices connus.
function parseShared(hash){
  const m=/^#avec=(.+)$/.exec(hash||''); if(!m) return null;
  try{ const d=JSON.parse(decodeURIComponent(m[1])), x=(Array.isArray(d.x)?d.x:[]).filter(id=>typeof id==='string' && EXM[id]).slice(0,12);
    return x.length ? {de:String(d.de||'').trim().slice(0,30), s:TPL[d.s]?d.s:'A', x} : null; }catch(e){ return null; }
}
function startWorkout(key,idx,home,sh){
  const p=home?homeOf(S.profile):S.profile, ws=workouts(), t=now(), dl=deloadState(p,ws).active, ctx={deload:dl, returning:isReturning(ws,t), now:t};
  const pk=lsGet(PICK_KEY), items=sh
    ? sh.x.map((id,i)=>({slot:i, exId:id, sets:setsFor(p,i,dl), range:repRange(EXM[id],p,t), rest:restFor(EXM[id],p)}))   // mêmes exercices, ses propres charges
    : inOrder(plan(key,p,{deload:dl, now:t, vol:weekVolume(ws,t)}), pk&&pk.k===key&&pk.order);
  lsSet(sh?SHARED_KEY:PICK_KEY,null);
  const exs=items.map(it=>draftExercise(it,ctx));
  const fw=exs.find(e=>isWeighted(EXM[e.exId]));
  if(fw) fw.warm=approachSets(+fw.sets[0].kg||EXM[fw.exId].start,EXM[fw.exId],p);
  const rot=rotation(p);
  draft={id:uid(), tpl:key, rot:sh?null:(idx!=null&&rot[idx]===key)?idx:rot.indexOf(key), title:TPL[key].n+(sh?' avec '+(sh.de||'un ami'):home?' (maison)':''), ...(sh?{extra:true}:{}), home:!!home, startedAt:t, cur:0, deload:dl, warmup:{done:false}, ex:exs};
  saveDraft(); ui.screen='workout'; window.scrollTo(0,0); wakeLock(true); render();
}
function saveDraft(){ Store.saveDraft(); }
function readInputs(){
  if(!draft) return;
  document.querySelectorAll('[data-in]').forEach(el=>{ const e=draft.ex[+el.dataset.ex]; if(!e||e.exId!==el.dataset.id) return; const s=e.sets[+el.dataset.i]; if(!s) return; s[el.dataset.in]=el.value===''?'':+el.value; });
}
function validateSet(i){
  readInputs();
  const cur=draft.ex[draft.cur], s=cur.sets[i], ex=EXM[cur.exId];
  if(!ex.t && !(+s.reps>0)){ toast('Indique le nombre de répétitions faites.'); return; }
  s.done=true;
  cur.sets.forEach((x,j)=>{ if(j>i && !x.done && isWeighted(ex) && s.kg!==''){ x.kg=s.kg; const el=document.getElementById('kg-'+draft.cur+'-'+j); if(el) el.value=s.kg; } });
  const exDone=cur.sets.every(x=>x.done), allDone=draft.ex.every(e=>e.sets.every(x=>x.done));
  let nextLabel='';
  if(!exDone){ const n=cur.sets.findIndex(x=>!x.done), ns=cur.sets[n]; nextLabel='Série '+(n+1)+' · '+(ex.t?ns.secs+' s':(isWeighted(ex)?ns.reps+' reps à '+fmt(+ns.kg)+' kg':ns.reps+' reps')); }
  else if(draft.cur<draft.ex.length-1){ const nx=draft.ex.findIndex((e,k)=>k>draft.cur && e.sets.some(x=>!x.done)); const tg=nx>=0?nx:draft.cur+1; draft.cur=tg; nextLabel=EXM[draft.ex[tg].exId].n; }
  saveDraft();
  if(allDone){ render(); finishWorkout(); return; }
  startRest(cur.rest,nextLabel); if(exDone){ draft.rest.fi=draft.ex.indexOf(cur); saveDraft(); } render();
}
// « Trop dur » / « trop facile » : change l'exercice et mémorise le choix pour cet emplacement.
function switchVariant(dir){
  readInputs();
  const base=clone(S.profile), p=draft.home?homeOf(base):base, cur=draft.ex[draft.cur], id=variantOf(cur.exId,dir,p); if(!id) return;
  const sk=draft.home?'swapsHome':'swaps';
  if(!draft.extra && (!cur.fam || cur.fam===TPL[draft.tpl].slots[cur.slot])){ base[sk]={...base[sk], [draft.tpl+':'+cur.slot]:id}; Store.saveProfile(base); }   // exercice d'appoint de la semaine : choix non retenu
  const ex=EXM[id], undone=cur.sets.filter(s=>!s.done).length||cur.sets.length;
  const it={slot:cur.slot, fam:cur.fam, exId:id, sets:undone, range:repRange(ex,p,now()), rest:restFor(ex,p)};
  const fresh=draftExercise(it,{deload:draft.deload, returning:isReturning(workouts(),now())});
  if(cur.sets.some(s=>s.done)){ cur.sets=cur.sets.filter(s=>s.done); draft.ex.splice(draft.cur+1,0,fresh); draft.cur++; }
  else draft.ex[draft.cur]=fresh;
  saveDraft(); render(); toast((dir==='easy'?'Variante plus facile : ':'Variante plus dure : ')+ex.n+'.');
}

/* Repos et minuteurs */
let restTimer=null;
function startRest(secs,next,label){ lastTick=0; draft.rest={until:now()+secs*1000, total:secs, next, label:label||'Repos'}; saveDraft(); tickRest(); }
function tickRest(){
  clearInterval(restTimer);
  restTimer=setInterval(()=>{
    if(!draft||!draft.rest){clearInterval(restTimer);restTimer=null;return;}
    const left=(draft.rest.until-now())/1000, t=$('#rest-t'), arc=$('#rest-arc');
    if(t) t.textContent=mmss(left);
    countdown(left);
    if(arc){ const C=2*Math.PI*104; arc.setAttribute('stroke-dashoffset',(C*(1-Math.max(0,left)/draft.rest.total)).toFixed(1)); }
    if(left<=0) endRest(true);
  },200);
}
function endRest(natural){
  clearInterval(restTimer); restTimer=null;
  if(draft){ draft.rest=null; saveDraft(); }
  if(natural){ beep(); try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){} }
  renderLayer();
}
let actx=null;
// iPhone : le son ne peut démarrer qu'après un toucher, on prépare donc le haut-parleur au premier toucher.
function audioOn(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} }
function tone(freq,dur,at){ try{ audioOn(); const t=actx.currentTime+(at||0), o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=freq; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.2,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); o.start(t); o.stop(t+dur+.02); }catch(e){} }
function beep(){ tone(880,.35); tone(1175,.5,.3); }   // fin du minuteur
// Compte à rebours : un bip court à chacune des 5 dernières secondes.
let lastTick=0;
function countdown(left){ const s=Math.ceil(left); if(s>5){ lastTick=0; return; } if(s>=1 && s!==lastTick){ lastTick=s; tone(660,.12); } }
let wl=null;
async function wakeLock(on){ try{ if(on&&navigator.wakeLock&&!wl){ wl=await navigator.wakeLock.request('screen'); } else if(!on&&wl){ await wl.release(); wl=null; } }catch(e){} }

let chrono=null;
function startChrono(i){
  readInputs();
  const s=draft.ex[draft.cur].sets[i], total=+s.secs||30;
  chrono={i,total,until:now()+total*1000+3000};
  renderLayer(); clearInterval(restTimer);
  restTimer=setInterval(()=>{
    if(!chrono){clearInterval(restTimer);return;}
    const left=(chrono.until-now())/1000, t=$('#rest-t'), lab=$('#chrono-lab'), arc=$('#rest-arc');
    if(left>chrono.total){ if(t) t.textContent=Math.ceil(left-chrono.total); if(lab) lab.textContent='Prépare-toi'; countdown(left-chrono.total); }
    else { if(t) t.textContent=mmss(left); countdown(left); if(lab) lab.textContent='Tiens bon'; if(arc){const C=2*Math.PI*104; arc.setAttribute('stroke-dashoffset',(C*(1-Math.max(0,left)/chrono.total)).toFixed(1));} }
    if(left<=0){ clearInterval(restTimer); restTimer=null; beep(); const idx=chrono.i; chrono=null; validateSet(idx); }
  },200);
}
function stopChrono(save){
  clearInterval(restTimer); restTimer=null;
  if(chrono && save){ const held=Math.max(0,Math.round(chrono.total-(chrono.until-now())/1000)), idx=chrono.i; draft.ex[draft.cur].sets[idx].secs=held; const el=document.getElementById('r-'+draft.cur+'-'+idx); if(el) el.value=held; chrono=null; if(held>0) validateSet(idx); else render(); }
  else { chrono=null; renderLayer(); }
}

function finishWorkout(){
  readInputs(); endRest(false); wakeLock(false);
  const w=draft, date=new Date().toISOString();
  const exercises=w.ex.map(e=>({exId:e.exId, ...(e.feel?{feel:e.feel}:{}), sets:[
      ...(e.warm||[]).filter(s=>s.done).map(s=>({kg:+s.kg||0, reps:+s.reps||0, secs:0, warm:true})),
      ...e.sets.filter(s=>s.done).map(s=>({kg:s.kg===''?0:+s.kg, reps:s.reps===''?0:+s.reps, secs:s.secs===''?0:+s.secs}))]}))
    .filter(e=>work(e.sets).length);
  if(!exercises.length){ ui.sheet={type:'quit', empty:true}; renderLayer(); return; }
  const prs=[];
  if(!w.deload) exercises.forEach(e=>{ const ex=EXM[e.exId], prev=bestBefore(e.exId), cur=scoreOf(ex,work(e.sets)); if(prev!=null && cur!=null && cur>prev+1e-9) prs.push(e.exId); });

  ui.summary={id:w.id, kind:'workout', tpl:w.tpl, rot:w.rot, title:w.title, date, durationSec:Math.round((now()-w.startedAt)/1000), exercises, prs, xp:50+5*setsN+25*prs.length, deload:!!w.deload, ...(w.extra?{extra:true}:{}), _vol:vol, _sets:setsN};

  }
  if(sh.type==='sess'){
    const s=S.sessions.find(x=>x.id===sh.v); if(!s) return '<p>Séance introuvable.</p>';
    return `<div class="stack"><div><span class="eyebrow">${fmtDate(s.date)}</span><h2 style="margin-top:2px">${esc(s.title)}</h2></div>

      :`<p>${s.minutes} minutes · +${s.xp} XP</p>`}

      :`<button class="btn danger" data-a="sessconfirm">${ic('trash')} Supprimer cette séance</button>`}</div>`;
  }
  if(sh.type==='redo') return `<div class="stack"><h2>Modifier mes réponses</h2><p class="muted">L’Oracle va construire un nouveau plan. Ton historique et tes badges sont conservés.</p>
      <button class="btn primary big" data-a="redogo">Continuer</button><button class="btn ghost" data-a="closesheet">Annuler</button></div>`;
  if(sh.type==='rename') return `<div class="stack"><h2>Ton prénom</h2><div class="field"><label for="rn-name">Prénom</label><input id="rn-name" class="input" maxlength="30" value="${esc(p.name)}"></div><button class="btn primary big" data-a="renamesave">Enregistrer</button></div>`;
  if(sh.type==='quit'){
    const any=draft&&draft.ex.some(e=>e.sets.some(s=>s.done));
    return `<div class="stack"><h2>${sh.empty?'Aucune série validée':'Quitter la séance ?'}</h2>
      <p class="muted">${sh.empty?'Valide au moins une série pour enregistrer la séance.':any?'Tu peux enregistrer ce que tu as déjà fait.':'Rien n’a encore été validé.'}</p>
      ${any&&!sh.empty?`<button class="btn primary big" data-a="finish">Terminer et enregistrer</button>`:''}
      <button class="btn ghost" data-a="closesheet">Continuer la séance</button>
      <button class="btn danger" data-a="abandon">Abandonner sans enregistrer</button></div>`;
  }
  if(sh.type==='reset'){
    return `<div class="stack"><h2>Tout effacer ?</h2><p class="muted">Ton programme et tes ${S.sessions.length} séances seront supprimés. Impossible de revenir en arrière.</p>
      <button class="btn danger" data-a="resetgo">Oui, tout effacer</button><button class="btn ghost" data-a="closesheet">Annuler</button></div>`;
  }
  return '';
}

let toastT=null;
// Le message vit hors du calque des fenêtres : il ne redessine pas la fiche ouverte.
function toast(msg){
  let el=$('#toastbox'); if(!el){ el=document.createElement('div'); el.id='toastbox'; document.body.appendChild(el); }
  el.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toastT); toastT=setTimeout(()=>{ el.innerHTML=''; },3200);
}

// Fenêtre du bas : on la ferme en la glissant vers le bas (depuis la poignée, ou n'importe où quand son contenu est tout en haut).
let drag=null;
document.addEventListener('touchstart',e=>{
  const s=e.target.closest('.sheet'); if(!s || e.target.closest('input,textarea,select,.grip')) return;
  if(s.scrollTop>0 && !e.target.closest('.grab')) return;
  drag={s, y:e.touches[0].clientY, dy:0, grab:!!e.target.closest('.grab')};
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!drag) return;
  const dy=e.touches[0].clientY-drag.y;
  if(!drag.grab && (drag.s.scrollTop>0 || (dy<0 && !drag.dy))){ drag.s.style.transform=''; drag=null; return; }   // l'utilisatrice fait défiler le contenu
  drag.dy=Math.max(0,dy); if(e.cancelable) e.preventDefault();
  drag.s.style.transition='none'; drag.s.style.transform=`translateY(${drag.dy}px)`;
},{passive:false});
document.addEventListener('touchend',()=>{
  if(!drag) return; const {s,dy}=drag; drag=null;
  s.style.transition='transform .22s ease-out';
  if(dy>100){ s.style.transform='translateY(110%)'; setTimeout(()=>{ ui.sheet=null; renderLayer(); },200); }
  else s.style.transform='';
});
// Ordre des exercices : on fait glisser les deux traits (ou flèches haut/bas au clavier).
const SORT={
  home(order){ lsSet(PICK_KEY,{...ui.cur, order}); render(); },
  wk(order){
    readInputs(); const w=draft, cur=w.ex[w.cur], open=e=>e.sets.some(s=>!s.done), moved=order.map(k=>w.ex.find(e=>String(e.slot)===k));
    w.ex=w.ex.map(e=>open(e)?moved.shift():e);   // les exercices terminés restent à leur place
    w.cur=open(cur)&&cur.sets.some(s=>s.done)?w.ex.indexOf(cur):w.ex.findIndex(open);
    saveDraft(); render();
  }
};
const sortKeys=ol=>[...ol.children].map(x=>x.dataset.k);
let sortD=null;
document.addEventListener('pointerdown',e=>{
  const g=e.target.closest('.grip'); if(!g) return;
  const li=g.closest('li'); sortD={li, ol:li.parentNode, y:e.clientY, o0:sortKeys(li.parentNode).join()};
  li.classList.add('lift'); g.setPointerCapture(e.pointerId); e.preventDefault();
});
document.addEventListener('pointermove',e=>{
  if(!sortD) return; const d=sortD, li=d.li, top=li.offsetTop;
  li.style.transform=`translateY(${e.clientY-d.y}px)`;
  const r=li.getBoundingClientRect(), mid=r.top+r.height/2, nx=li.nextElementSibling, pv=li.previousElementSibling;
  if(nx && mid>nx.getBoundingClientRect().top+nx.offsetHeight/2) d.ol.insertBefore(nx,li);
  else if(pv && mid<pv.getBoundingClientRect().top+pv.offsetHeight/2) d.ol.insertBefore(li,pv);
  else return;
  d.y+=li.offsetTop-top; li.style.transform=`translateY(${e.clientY-d.y}px)`;   // l'exercice reste sous le doigt
});
const sortEnd=()=>{ if(!sortD) return; const {li,ol,o0}=sortD; sortD=null; li.classList.remove('lift'); li.style.transform=''; const ks=sortKeys(ol); if(ks.join()!==o0) SORT[ol.dataset.sort](ks); };
document.addEventListener('pointerup',sortEnd); document.addEventListener('pointercancel',sortEnd);
document.addEventListener('keydown',e=>{
  const g=e.target.closest && e.target.closest('.grip'); if(!g || (e.key!=='ArrowUp' && e.key!=='ArrowDown')) return; e.preventDefault();
  const li=g.closest('li'), ol=li.parentNode, s=ol.dataset.sort, k=li.dataset.k, sib=e.key==='ArrowUp'?li.previousElementSibling:li.nextElementSibling; if(!sib) return;
  e.key==='ArrowUp'?ol.insertBefore(li,sib):ol.insertBefore(sib,li);
  SORT[s](sortKeys(ol)); const ng=document.querySelector(`[data-sort="${s}"] li[data-k="${k}"] .grip`); if(ng) ng.focus();
});
// Questionnaire : « Suivant » s'active dès que les champs sont valides.
document.addEventListener('input',e=>{ if(e.target.closest('.ob') && e.target.matches('input')){ readOb(); const b=document.querySelector('.ob [data-a="obnext"]'); if(b) b.disabled=!obOk(ui.ob.step,ui.ob.data); } });
// Mise à jour : on regarde si une version plus récente est en ligne au retour sur l'appli, puis toutes les 10 minutes.
async function checkUpdate(){
  if(ui.update || !navigator.onLine) return;
  try{
    const t=await (await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'})).text();
    const m=t.match(/const APP_VERSION = '([^']+)'/);
    if(m && m[1]!==APP_VERSION){ ui.update=true; renderLayer(); }
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') checkUpdate(); });
setInterval(checkUpdate,10*60*1000);
setTimeout(checkUpdate,4000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ if(ui.screen==='workout'&&draft){ wakeLock(true); if(draft.rest) tickRest(); } } else { wl=null; } });

// Accès aux règles pour les tests automatiques (aucun effet sur l'appli).
window.Askesia = {parseShared, weekStreak, bestStreakEver, Store, S, restedIndex, accFamilies, sessionFeel, inOrder, badgeDone, badgeHow, homeOf, startLoad, obProfile, ui, EX, EXM, TPL, PROGRAMS, GOALS, LEVELS, plan, rotation, programFor, needsFewerDays, nextIndex, suggest, incOf, repRange, setsFor, deloadReason, deloadState, isReturning, weekVolume, volumeZone, variantOf, available, approachSets};

// Séance en cours enregistrée par l'ancienne version : on la rend compatible.
if(draft && !draft.warmup){ draft.warmup={done:true}; draft.ex.forEach(e=>{ if(!e.range && e.repMin) e.range=[e.repMin,e.repMax]; }); }
if(draft) ui.screen=null;
if(typeof location!=='undefined' && location.hash){ const sh=parseShared(location.hash); if(sh){ lsSet(SHARED_KEY,sh); ui.tab='home'; history.replaceState(null,'',location.pathname+location.search); } }
Store.init();
// Rend l'appli installable sur Android (« Installer l'appli » dans Chrome).
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
